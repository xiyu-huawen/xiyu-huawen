app = 'xiyu-huawen'
primary_region = 'sin'

[build]
  dockerfile = 'deploy/fly.Dockerfile'

[env]
  DATA_DIR = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    type = 'http'
    port = 8080
    path = '/api/health'
    interval = '30s'
    timeout = '5s'

[vm]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'xiyu_data'
  destination = '/data'
  processes = ['app']
