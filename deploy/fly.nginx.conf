server {
 listen 8080;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 21m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
 location /api/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 180s; }
 location /assets/ { proxy_pass http://127.0.0.1:8000; }
 location /import-assets/ { proxy_pass http://127.0.0.1:8000; }
 location = /index.html { expires -1; }
 location / { try_files $uri $uri/ /index.html; }
}
