services:
  api:
    image: xiyuhuawen-api:${IMAGE_TAG:-1.3.0-arm64}
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DATA_DIR: /data
      IMAGE_DAILY_LIMIT: ${IMAGE_DAILY_LIMIT:-10}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-https://api.openai.com/v1}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-1.5}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_MODEL: ${ARK_MODEL:-doubao-seed-evolving}
      ARK_API_KEY: ${ARK_API_KEY:-}
      JIMENG_BASE_URL: ${JIMENG_BASE_URL:-http://host.docker.internal:5100/v1}
      JIMENG_MODEL: ${JIMENG_MODEL:-jimeng-4.5}
      JIMENG_SESSION_ID: ${JIMENG_SESSION_ID:-}
    volumes:
      - xiyu-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  web:
    image: xiyuhuawen-web:${IMAGE_TAG:-1.3.0-arm64}
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - '${PORT:-8088}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  xiyu-data:
