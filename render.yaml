services:
  - type: web
    name: xiyu-huawen
    runtime: docker
    dockerfilePath: deploy/fly.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: 8080
      - key: ADMIN_PASSWORD
        sync: false
